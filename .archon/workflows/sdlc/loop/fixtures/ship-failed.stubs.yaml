# Dry-run fixture: ship fails at its forge check, before triage. check-app joins with
# all_done, so both reviewers still run and the reviewer records the attempt on the
# work item instead of a silent failed run.
pick:
  route: complex
  target: https://example.atlassian.net/browse/CONC-6
  pr: ''
  confidence: high
  depth: normal
  area: app/
  reason: 'stub: tags need a migration and search across modules'
# Ship's first node refuses the run before any agent spends. The stub breaks the
# node's output contract, which fails the node the way a refusing forge check does.
ship__forge: { source: refused }
subject:
  pr: ""
  head: ""
  base: ""
  files: ""
  started: "1700000000000"
check-app:
  pr: ""
  head: ""
  merged_with: ""
  lines: []
  noticed: []
  overall: "NO PR"
  summary: "the issue has no open pull request; the pipeline stopped before publishing"
evidence:
  ok: "true"
  problems: ""
  overall: "NO PR"
  checked_at: "1700000100000"
review:
  outcome: nothing
  pr: ''
  sha: ''
  delivers: none
  tasks_done: "Tasks done: none"
  dispositions: []
  judge_changes: []
  reason: 'stub: ship stopped at its forge check'
claim:
  held: "true"
  holder: fixture-run
  reason: "stub: this run holds the work item"
release: "released 1 claim(s)"
# The holdout briefs copy and the reviewer handoff are scripts with no decision in them.
briefs: ""
handoff:
  dir: "stub/handoff"

# The tracker nodes: the repository tracks its work in Jira, so tracker-read wrote the
# lap's board for the agents; no agent asked for a write. Stubbed under --exec-code too:
# the real scripts would read the scratch checkout, which has no .archon/tracker.json.
tracker-read:
  ready: jira
  board: "stub/tracker/board.md"
write-pick: &no-writes
  applied: "0"
  created: "{}"
write-build: *no-writes
write-review: *no-writes
fixture:
  expect: failed
  fail-node: ship__forge
  reached:
  - tracker-read
  - pick
  - write-pick
  - claim
  - write-build
  - subject
  - check-app
  - evidence
  - review
  - write-review
  - release
  resolved-text-contains:
    review: "handoff/app-check.json"
exec-code: true

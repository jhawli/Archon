# Dry-run fixture: the complex route. pick routes the issue to archon-ship, which
# runs inline (stubs from ship's direct-delivered fixture; the nodes outside delivery's rounds
# carry the ship__ prefix, the rounds' body nodes keep their own names);
# the in-loop builder stays skipped (no build stub), and the black-box check and
# reviewer still run after ship. Here the holdout catches what ship's own review passed.
pick:
  route: complex
  target: https://example.atlassian.net/browse/CONC-6
  pr: ''
  confidence: high
  depth: normal
  area: app/
  reason: 'stub: tags need a migration and search across modules'
ship__forge: { source: forge }
ship__deliver__forge: { source: forge }
ship__triage__triage:
  decision: { contract: READY, route: deliver }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  related: []
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
implement__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented; focused checks pass"
pr__forge: { source: forge }
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, description: null, summary: "stub: target recorded" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 1, url: "https://github.com/example/repo/pull/1", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review__route: { seams: true, code: true, tests: true, errors: false, docs: false, reason: "stub: the change touches a persisted format" }
review__scope:
  head_matches: true
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 1 }
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
review__seams: "0 findings"
review__code: "0 findings"
review__tests: "0 findings"
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: none"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: none"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
simplify__simplify: { findings: false }
simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
threads: { open: 0, summary: "stub: no review thread is unresolved" }
ci: { state: green, rerun: none, summary: "stub: every check passed; marked ready" }
ship__deliver__update-pr-body: { changed: false, summary: "stub: the description is still accurate" }
subject:

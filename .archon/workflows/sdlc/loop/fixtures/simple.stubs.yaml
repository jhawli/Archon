# Dry-run fixture: the simple route. pick chooses a contained ticket, the in-loop
# builder builds it, subject names what the black-box check tests, the check and
# the evidence check run, the reviewer decides to merge, and the merge gate (land)
# merges. Ship and deploy stay skipped (no ship stubs: a ship node that ran would
# fail the fixture as a reached node without a stub).
pick:
  route: simple
  target: "https://example.atlassian.net/browse/CONC-5"
  pr: ""
  confidence: high
  depth: normal
  area: app/
  reason: "stub: next unblocked issue, one module, clear criteria"
build: "Built the notes endpoint.\nPR: https://github.com/example/app/pull/9"
subject:
  pr: "https://github.com/example/app/pull/9"
  head: "abc1234"
  base: main
  files: "app/notes.py"
  started: "1700000000000"
check-app:
  pr: "https://github.com/example/app/pull/9"
  head: "abc1234"
  merged_with: "abc1234"
  lines:
  - id: C1
    kind: criterion
    verdict: PASS
    text: "saves a note: POST /notes returned 201"
    evidence: ["/artifacts/c1.txt"]
    pre_existing: ""
    defect: ""
    carried_from: ""
  noticed: []
  overall: "PASS"
  summary: "stub: saves a note, no defects seen"
evidence:
  ok: "true"
  problems: ""
  overall: PASS
  checked_at: "1700000100000"
review:
  outcome: merge
  pr: "https://github.com/example/app/pull/9"
  sha: abc1234
  delivers: all
  tasks_done: "Tasks done: none"
  dispositions: []
  judge_changes: []
  reason: "stub: every criterion passed, CI green"
land:
  outcome: merged
  reason: "stub: merged abc1234"
claim:
  held: "true"
  holder: fixture-run
  reason: "stub: this run holds the work item"
release: "released 1 claim(s)"
# The holdout briefs copy and the reviewer handoff are scripts with no decision in them.
briefs: ""
handoff:
  dir: "stub/handoff"

# The tracker nodes: the repository tracks its work in Jira, so tracker-read wrote the
# lap's board for the agents; no agent asked for a write.
tracker-read:
  ready: jira
  board: "stub/tracker/board.md"
write-pick: &no-writes
  applied: "0"
  created: "{}"
write-build: *no-writes
write-review: *no-writes
fixture:
  expect: completed
  reached: [tracker-read, pick, write-pick, claim, build, write-build, subject, check-app, evidence, handoff, review, write-review, land, release]
  resolved-text-contains:
    build: "Route: simple"
    check-app: "/private/holdout.md"
    review: "Work item: https://example.atlassian.net/browse/CONC-5"
  inputs:
    runtime: "/private/run-the-app.md"
    holdout: "/private/holdout.md"

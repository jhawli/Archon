# Dry-run fixture: the continue route. pick names an open pull request with
# findings; the builder is told which one, the black-box check is told only the pull
# request and its head (never the builder's report), and the reviewer sees both.
# The reviewer sends it back, so the merge gate never runs.
pick:
  route: continue
  target: "https://example.atlassian.net/browse/CONC-3"
  pr: "https://github.com/example/app/pull/7"
  confidence: high
  depth: normal
  area: app/
  reason: "stub: review findings outstanding on a loop-owned pull request"
build: "Fixed the review findings on the open pull request.\nPR: https://github.com/example/app/pull/7"
subject:
  pr: "https://github.com/example/app/pull/7"
  head: "def5678"
  base: main
  files: "app/notes.py"
  started: "1700000000000"
check-app:
  pr: "https://github.com/example/app/pull/7"
  head: "def5678"
  merged_with: "def5678"
  lines:
  - id: C1
    kind: criterion
    verdict: PASS
    text: "the skipped test runs and passes"
    evidence: ["/artifacts/c1.txt"]
    pre_existing: ""
    defect: ""
    carried_from: ""
  noticed: []
  overall: "PASS"
  summary: "stub: no defects seen"
evidence:
  ok: "true"
  problems: ""
  overall: PASS
  checked_at: "1700000100000"
review:
  outcome: sent-back
  pr: "https://github.com/example/app/pull/7"
  sha: def5678
  delivers: none
  tasks_done: "Tasks done: none"
  dispositions: []
  judge_changes: []
  reason: "stub: a test was skipped to get green"
claim:
  held: "true"
  holder: fixture-run
  reason: "stub: this run holds the work item"
release: "released 1 claim(s)"
# The holdout briefs copy and the reviewer handoff are scripts with no decision in them.
briefs: ""
handoff:
  dir: "stub/handoff"

# The tracker nodes: the repository tracks its work in Jira, so tracker-read wrote the
# lap's board for the agents; no agent asked for a write.
tracker-read:
  ready: jira
  board: "stub/tracker/board.md"
write-pick: &no-writes
  applied: "0"
  created: "{}"
write-build: *no-writes
write-review: *no-writes
fixture:
  expect: completed
  reached: [tracker-read, pick, write-pick, claim, build, write-build, subject, check-app, evidence, handoff, review, write-review, release]
  resolved-text-contains:
    build: "https://github.com/example/app/pull/7"
    check-app: "Pull request: https://github.com/example/app/pull/7"
    review: "handoff/app-check.json"
  inputs:
    runtime: "/private/run-the-app.md"

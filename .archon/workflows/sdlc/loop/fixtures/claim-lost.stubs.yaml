# Dry-run fixture: a parallel run claimed the same ticket moments earlier. claim
# reports the item held by the other run, so this run builds nothing, checks
# nothing, reviews nothing and has no claim to release; an unstubbed node that
# ran would fail the fixture.
pick:
  route: simple
  target: "https://example.atlassian.net/browse/CONC-5"
  pr: ""
  confidence: high
  depth: normal
  area: app/notes.py
  reason: "stub: next unblocked issue, one module, clear criteria"
claim:
  held: "false"
  holder: other-run
  reason: "stub: run other-run claimed https://example.atlassian.net/browse/CONC-5 first; this run does no work this lap"
# The tracker nodes: the repository tracks its work in Jira, so tracker-read wrote the
# lap's board for the agents; no agent asked for a write.
tracker-read:
  ready: jira
  board: "stub/tracker/board.md"
write-pick: &no-writes
  applied: "0"
  created: "{}"
fixture:
  expect: completed
  reached: [tracker-read, pick, write-pick, claim]

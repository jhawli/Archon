# Agent outputs are simulated; script nodes execute through the fixture runner. Jira did not
# answer during tracker-read (checked "false"): the proposal stays local, render writes
# "Publication unavailable: nicht geprüft", and nothing is actionable.
tracker-read: { checked: "false", board: "", project: CONC, site: "https://example.atlassian.net" }
revalidate:
  entries:
    - item_index: 0
      verdict: supported
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
search-existing:
  entries:
    - item_index: 0
      tracker_checked: false
      matches: []
classify:
  entries:
    - item_index: 0
      classification: new
      target_item: null
      public_title: "Example source finding"
      public_summary: "A fixture proposal for reviewer inspection."
      disclosure_safe: true
      rationale: "stub: the board could not be read, so this is proposed locally with publication unavailable"
fixture:
  expect: completed
  reached: [resolve-input, revalidate, check-evidence, search-existing, classify, render]
  inputs:
    discovery_artifact: ".archon/workflows/sdlc/discoveries/fixtures/data/single.json"
exec-code: true

# Package-test scenario: agents and gh reads are simulated; scripts and git execute for real.
tracker-read: { checked: "true", board: stub, project: CONC, site: "https://example.atlassian.net" }
revalidate:
  entries:
    - item_index: 0
      verdict: supported
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
search-existing:
  entries:
    - item_index: 0
      tracker_checked: true
      matches:
        - key: CONC-55
          url: "https://example.atlassian.net/browse/CONC-55"
          title: "Existing tracked item, same defect"
          similarity_note: "stub: same underlying problem"
classify:
  entries:
    - item_index: 0
      classification: duplicate
      target_item: { key: CONC-55, url: "https://example.atlassian.net/browse/CONC-55" }
      public_title: "Example source finding"
      public_summary: "A fixture proposal for reviewer inspection."
      disclosure_safe: true
      rationale: "stub: same defect as CONC-55"
fixture:
  expect: completed
  reached: [resolve-input, revalidate, check-evidence, search-existing, classify, render]
  inputs:
    discovery_artifact: ".archon/workflows/sdlc/discoveries/fixtures/data/single.json"
exec-code: true

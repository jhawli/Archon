name: archon-discoveries
description: |
  Revalidate a discovery artifact against this checkout's pinned HEAD, find
  existing work among the Jira tickets (and pull requests when GitHub is
  reachable), and render local action proposals. Use after review or
  implementation records adjacent discoveries. Optional publication files new
  tickets and comments in Jira by script, after explicit authorization.

model: medium
interactive: true
inputs:
  publication:
    default: preview
    description: preview writes local proposals; approve waits for a human; auto authorizes publication for this run.
  discovery_artifact:
    default: ""
    description: Path to consolidated discoveries.json or a raw discovery sidecar.
  run_id:
    default: ""
    description: >-
      Terminal run ID resolved through workflow get --json artifacts_dir and
      leave_behind.artifactFiles. Supply exactly one run_id or discovery_artifact.

returns: render

nodes:
  # First node (AK18e): without .archon/tracker.json the run ends here, before any agent.
  # Then every ticket for the search; when Jira does not answer, checked is "false" and
  # nothing is published.
  - id: tracker-read
    script: discoveries-read
    runtime: bun
    mutates_checkout: false
    output_format:
      type: object
      properties:
        checked: { type: string }
        board: { type: string }
        project: { type: string }
        site: { type: string }
      required: [checked, board, project, site]

  - id: resolve-input
    script: resolve-input
    runtime: uv
    mutates_checkout: false
    depends_on: [tracker-read]
    output_format:
      type: object
      properties:
        count: { type: integer }
        forge_available: { type: boolean }
        forge_host: { type: string }
        forge_path: { type: string }
      required: [count, forge_available, forge_host, forge_path]
    with:
      discovery_artifact: "$INPUTS.discovery_artifact"
      run_id: "$INPUTS.run_id"
      project: "$tracker-read.output.project"
      site: "$tracker-read.output.site"

  - id: revalidate
    command: revalidate
    mutates_checkout: false
    model: medium
    allowed_tools: [Read, Grep, Glob, Bash]
    output_type: discovery-revalidation
    output_format:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              item_index: { type: integer }
              verdict:
                type: string
                enum: [supported, disproved, inconclusive]
              evidence_refs:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    line: { type: integer }
                  required: [path, line]
              note: { type: string }
            required: [item_index, verdict, evidence_refs, note]
      required: [entries]
    depends_on: [resolve-input]

  - id: check-evidence
    script: check-evidence
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      properties:
        count: { type: integer }
        unverified_count: { type: integer }
      required: [count, unverified_count]
    depends_on: [revalidate]
    with:
      revalidation: "$revalidate.output.entries"

  - id: search-existing
    command: search-existing
    mutates_checkout: false
    model: medium
    allowed_tools: [Read, Grep, Glob, Bash]
    output_type: discovery-search
    output_format:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              item_index: { type: integer }
              tracker_checked: { type: boolean }
              matches:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    url: { type: string }
                    title: { type: string }
                    similarity_note: { type: string }
                  required: [key, url, title, similarity_note]
            required: [item_index, tracker_checked, matches]
      required: [entries]
    depends_on: [check-evidence, tracker-read]

  - id: classify
    command: classify
    mutates_checkout: false
    model: medium
    allowed_tools: [Read]
    output_type: discovery-classification
    output_format:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              item_index: { type: integer }
              classification:
                type: string
                enum: [stale, duplicate, update-existing, new]
              target_item:
                type: [object, "null"]
                properties:
                  key: { type: string }
                  url: { type: string }
                required: [key, url]
              public_title: { type: string }
              public_summary: { type: string }
              disclosure_safe: { type: boolean }
              rationale: { type: string }
            required: [item_index, classification, target_item, public_title, public_summary, disclosure_safe, rationale]
      required: [entries]
    depends_on: [search-existing]

  - id: render
    script: render-proposals
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      properties:
        count: { type: integer }
        stale_count: { type: integer }
        duplicate_count: { type: integer }
        update_existing_count: { type: integer }
        new_count: { type: integer }
      required:
        [count, stale_count, duplicate_count, update_existing_count, new_count]
    depends_on: [classify, resolve-input, search-existing, tracker-read]
    with:
      search_results: "$search-existing.output.entries"
      classification: "$classify.output.entries"
      tracker_checked: "$tracker-read.output.checked"

  - id: authorize-publication
    depends_on: [render]
    when: "$INPUTS.publication == 'approve'"
    approval:
      message: "Publish the supported proposals in $ARTIFACTS_DIR/discovery-proposals.md?"
      decisions:
        - id: approve
          label: Publish proposals
        - id: hold
          label: Keep local

  # A script, not an agent (AK18g): it writes only on auto or an approval, new findings as
  # tickets, new evidence for an open ticket as one comment there.
  - id: publish
    script: publish-discoveries
    runtime: bun
    mutates_checkout: false
    depends_on: [render, authorize-publication, tracker-read]
    trigger_rule: none_failed_min_one_success
    when: "$INPUTS.publication == 'approve' || $INPUTS.publication == 'auto'"
    with:
      mode: "$INPUTS.publication"
      approval: { from: "$authorize-publication.output", if_skipped: null }
      checked: "$tracker-read.output.checked"
    output_format:
      type: object
      properties:
        published: { type: boolean }
        urls: { type: array, items: { type: string } }
        summary: { type: string }
      required: [published, urls, summary]

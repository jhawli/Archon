# Dry-run fixture (with --exec-code: deploy__verify really runs). The batch merged, the
# service never reports healthy after the one rollout: verify fails the deploy block, and
# ticket-status still runs after it (trigger_rule: all_done), so the tickets go to Review
# with a question instead of staying unseen. Every other script is stubbed.
tracker-check: ""
ci-policy:
  requirement: "required"
  source: "declared"
  checks: ["tests"]
  checks_state: "passing"
  results:
    - pr: "https://github.com/example/app/pull/7"
      head_sha: "0123456789abcdef0123456789abcdef01234567"
      check: "tests"
      state: "passing"
  reason: ""
path-policy:
  state: "not_applicable"
  patterns: []
  heads: []
  matches: []
  reason: ""
assess:
  summary: "stub: batch eligible"
  eligible: true
  method: "squash"
  validation_verified: true
  review_verified: true
  plan_digest: "fixture"
  holds: []
publish-holds:
  published: false
  updated: []
  summary: "stub: nothing to publish"
gate:
  ready: true
  summary: "stub: gate ready"
  method: "squash"
  plan_digest: "fixture"
refresh:
  authorized: true
  repository: "example/app"
  number: 7
  head_sha: "0123456789abcdef0123456789abcdef01234567"
  method: "squash"
  summary: "stub: fresh facts pass"
execute:
  done: true
  merged: true
  urls: ["https://github.com/example/app/pull/7"]
  queued: []
  prior_base_sha: "fixture-base"
  summary: "stub: merged"
merged-any: { count: "1" }
deploy__resolve:
  revision: 0123456789abcdef0123456789abcdef01234567
  branch: main
  deploy: 'true'
  health: 'false'
  identity: ''
deploy__deploy: '{"ok":true}'
deploy__health: '{"ok":false}'
ticket-status: "CONC-7: Review, asked the owner"
fixture:
  expect: failed
  fail-node: deploy__verify
  reached: [ticket-status]
  inputs:
    prs: '["https://github.com/example/app/pull/7"]'
    mode: "auto"
    merge_method: "squash"
    required_checks: "tests"
    deploy: "true"
    health: "false"
exec-code: true
